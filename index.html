<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FC3564'><path d='M12 2c1.1 0 2 .9 2 2 0 .5-.2 1-.5 1.4L10 11h4l-3 11 9-13h-5l2-7z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0D0F12" />
    <meta name="description" content="Ultra-fast, privacy-first live esports hub. Pick a game, watch official tournament streams instantly on Twitch & YouTube with zero clutter and zero video hosting." />
    <meta name="keywords" content="esports, live stream, CS2, Valorant, PUBG, League of Legends, Dota 2, tournament, Twitch, YouTube" />
    
    <!-- OpenGraph / Social Cards -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="RageTV – Pick a game. Watch live esports." />
    <meta property="og:description" content="Live esports tournament discovery and viewing hub powered exclusively by official embedded players." />
    <meta property="og:site_name" content="RageTV" />

    <title>RageTV – Pick a game. Watch live esports.</title>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('ragetv_theme');
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-surface-base">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
