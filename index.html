<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logos/rtv-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" />
    <link rel="canonical" href="https://ragetv.vercel.app/" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="apple-touch-icon" href="/logos/rtv-icon.png" />
    
    <meta name="description" content="Ultra-fast, privacy-first live esports hub. Pick a game, watch official tournament streams instantly on Twitch & YouTube with zero clutter and zero video hosting." />
    <meta name="keywords" content="esports, live stream, CS2, Valorant, PUBG, League of Legends, Dota 2, tournament, Twitch, YouTube" />
    <meta name="robots" content="index, follow" />
    
    <!-- Google Fonts: Orbitron (Titles) & Chakra Petch (Text) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Orbitron:wght@400..900&display=swap" rel="stylesheet" />

    <!-- Font Awesome 6 (Icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- OpenGraph / Social Cards -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ragetv.vercel.app/" />
    <meta property="og:title" content="RageTV – Live Esports Streams" />
    <meta property="og:description" content="Live esports tournament discovery and viewing hub powered exclusively by official embedded players." />
    <meta property="og:site_name" content="RageTV" />
    <meta property="og:image" content="https://ragetv.vercel.app/logos/rtv-logo.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RageTV – Live Esports Streams" />
    <meta name="twitter:description" content="Live esports tournament discovery and viewing hub powered exclusively by official embedded players." />
    <meta name="twitter:image" content="https://ragetv.vercel.app/logos/rtv-logo.png" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "RageTV",
      "url": "https://ragetv.vercel.app/",
      "description": "Ultra-fast, privacy-first live esports hub. Pick a game, watch official tournament streams instantly on Twitch & YouTube with zero clutter and zero video hosting.",
      "applicationCategory": "EntertainmentApplication",
      "operatingSystem": "All",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <title>RageTV – Live Esports Streams</title>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('ragetv_theme');
          // Default is strictly 'dark' if not set
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            if (!theme) {
              localStorage.setItem('ragetv_theme', 'dark');
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-surface-base">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
